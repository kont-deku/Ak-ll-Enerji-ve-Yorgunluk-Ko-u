{% extends "base.html" %}
{% block title %}Kayıt Ol · Enerji Koçu{% endblock %}
{% block main_class %}auth-page{% endblock %}

{% block content %}
  <p class="eyebrow">Yeni başlangıç</p>
  <h1>Hesap Oluştur</h1>
  <p class="subtitle">Enerji seviyeni takip etmeye bugün başla.</p>

  <div class="card">
    <form method="POST" action="{{ url_for('register') }}">
      <div class="field">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn">Kayıt Ol</button>
    </form>
    <p class="form-footer">Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş yap</a></p>
  </div>
{% endblock %}
